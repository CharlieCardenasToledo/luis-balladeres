# Configuración de Firebase App Hosting (plan, sección 58).
# Las variables NEXT_PUBLIC_* son públicas (van al bundle del navegador) y
# deben estar disponibles en BUILD además de RUNTIME para que Next.js las
# inline correctamente. Las credenciales del Admin SDK viven en Secret
# Manager (ver sección 41 del plan) y solo se resuelven en RUNTIME.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpuMiB: 1000
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://luis-balladeres--luis-balladeres.us-east4.hosted.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA-CtqgR63_cCXmDq9tjSr-vDga220I6Ig
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: luis-balladeres.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: luis-balladeres
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: luis-balladeres.firebasestorage.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "91519097470"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:91519097470:web:1941f0ba5a43d89435d62f"
    availability: [BUILD, RUNTIME]

  - variable: FIREBASE_STORAGE_BUCKET
    value: luis-balladeres.firebasestorage.app
    availability: [RUNTIME]

  # --- Secretos del Admin SDK (Secret Manager, nunca en texto plano) ---
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability: [RUNTIME]

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability: [RUNTIME]

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability: [RUNTIME]
